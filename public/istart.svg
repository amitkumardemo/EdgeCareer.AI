<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 80" width="280" height="80">
  <defs>
    <linearGradient id="istart-grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF5722"/>
      <stop offset="100%" stop-color="#FF9800"/>
    </linearGradient>
    <linearGradient id="istart-grad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00BCD4"/>
      <stop offset="100%" stop-color="#3F51B5"/>
    </linearGradient>
    <linearGradient id="istart-star" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFEB3B"/>
      <stop offset="100%" stop-color="#FF9800"/>
    </linearGradient>
  </defs>
  <!-- Background Badge Glow -->
  <rect width="280" height="80" rx="12" fill="#FFFFFF" opacity="0"/>
  
  <!-- iStart Rocket/Star Icon -->
  <g transform="translate(10, 10)">
    <!-- Shield / Badge Backing -->
    <path d="M 30,5 L 55,18 L 55,42 Q 30,58 30,58 Q 5,42 5,18 Z" fill="url(#istart-grad2)" />
    <!-- Rocket / Star Emblem inside Shield -->
    <path d="M 30,12 L 35,26 L 49,26 L 38,34 L 42,48 L 30,40 L 18,48 L 22,34 L 11,26 L 25,26 Z" fill="url(#istart-star)" />
  </g>

  <!-- Typography: iStart -->
  <text x="74" y="44" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="34" letter-spacing="-1">
    <tspan fill="#00BCD4">i</tspan><tspan fill="#FF5722">Start</tspan>
  </text>

  <!-- Subtitle: RAJASTHAN / GOVT RECOGNIZED -->
  <text x="76" y="60" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="10" fill="#374151" letter-spacing="2">
    RAJASTHAN
  </text>
  
  <!-- Small Govt Badge pill -->
  <rect x="165" y="49" width="105" height="15" rx="7.5" fill="#E0F2FE" />
  <text x="217.5" y="60" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="8.5" fill="#0369A1" text-anchor="middle" letter-spacing="0.5">
    GOVT RECOGNIZED
  </text>
</svg>
